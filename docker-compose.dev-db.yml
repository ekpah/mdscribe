services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mdscribe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mdscribe
    ports:
      - "5432:5432"
    volumes:
      - mdscribe-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mdscribe"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mdscribe-postgres-data:
