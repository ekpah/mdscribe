name: CI Checks

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Format + Lint + Types + Knip + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mdscribe
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d mdscribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      POSTGRES_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mdscribe
      POSTGRES_DATABASE_URL_TEST: postgres://postgres:postgres@127.0.0.1:5432/mdscribe_test
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Build workspace entrypoints
        run: bun run --cwd packages/markdoc-md build

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check

      - name: Lint packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      - name: Typecheck packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      - name: Run knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run knip

      - name: Migrate database
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run db:migrate

      - name: Run all tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test

  docker-build:
    name: Production Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --build-arg NEXT_PUBLIC_BASE_URL=https://mdscribe.example --tag mdscribe:ci .

  pr-summary:
    name: PR Test Summary
    runs-on: ubuntu-latest
    needs: [lint-and-unit, docker-build]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Build summary body
        id: summary
        run: |
          lint_status="${{ needs.lint-and-unit.result }}"
          docker_status="${{ needs.docker-build.result }}"

          to_emoji() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⚪ Cancelled" ;;
              skipped) echo "⚪ Skipped" ;;
              *) echo "⚠️ $1" ;;
            esac
          }

          {
            echo 'body<<EOF'
            echo '<!-- pr-test-summary -->'
            echo '## CI Test Summary'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Format + Lint + Types + Knip + Unit Tests | $(to_emoji "$lint_status") |"
            echo "| Production Docker Build | $(to_emoji "$docker_status") |"
            echo
            echo "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.summary.outputs.body }}`;
            const marker = '<!-- pr-test-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
