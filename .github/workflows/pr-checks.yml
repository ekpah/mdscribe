name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + Knip + Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint affected packages
        run: bun run lint:affected

      - name: Run knip
        run: bun run knip

      - name: Run affected tests
        run: bun run test:affected

  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: bunx playwright test
        working-directory: apps/app

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/app/playwright-report/
          if-no-files-found: ignore

  pr-summary:
    name: PR Test Summary
    runs-on: ubuntu-latest
    needs: [lint-and-unit, playwright]
    if: always()
    steps:
      - name: Build summary body
        id: summary
        run: |
          lint_status="${{ needs.lint-and-unit.result }}"
          e2e_status="${{ needs.playwright.result }}"

          to_emoji() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "⚪ Cancelled" ;;
              skipped) echo "⚪ Skipped" ;;
              *) echo "⚠️ $1" ;;
            esac
          }

          {
            echo 'body<<EOF'
            echo '<!-- pr-test-summary -->'
            echo '## CI Test Summary'
            echo
            echo '| Check | Result |'
            echo '| --- | --- |'
            echo "| Lint + Knip + Unit Tests (`bun run lint:affected`, `bun run knip`, `bun run test:affected`) | $(to_emoji "$lint_status") |"
            echo "| Playwright E2E (`bunx playwright test`) | $(to_emoji "$e2e_status") |"
            echo
            echo "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `${{ steps.summary.outputs.body }}`;
            const marker = '<!-- pr-test-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user.type === 'Bot' && comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
