name: CI Checks

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Format + Lint + Types + Knip + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mdscribe
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d mdscribe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      POSTGRES_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/mdscribe
      POSTGRES_DATABASE_URL_TEST: postgres://postgres:postgres@127.0.0.1:5432/mdscribe_test
      SKIP_ENV_VALIDATION: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile

      - name: Build workspace entrypoints
        run: bun run --cwd packages/markdoc-md build

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check

      - name: Lint packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint

      - name: Typecheck packages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck

      - name: Run knip
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run knip

      - name: Migrate database
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run db:migrate

      - name: Run all tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test

  docker-build:
    name: Production Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build production image
        run: docker build --build-arg NEXT_PUBLIC_BASE_URL=https://mdscribe.example --tag mdscribe:ci .

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [lint-and-unit, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      # Coolify builds whatever main points to, not this run's commit. If main has
      # moved on, the newer commit's own run deploys it after its checks pass.
      - name: Check main still points to this commit
        id: head
        run: |
          head_sha="$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)"
          echo "current=$([[ "${head_sha}" == "${GITHUB_SHA}" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "main is at ${head_sha}; this run tested ${GITHUB_SHA}."

      - name: Trigger Coolify deployment
        if: steps.head.outputs.current == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --request POST "${COOLIFY_WEBHOOK}" \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}"
