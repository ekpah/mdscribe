services:
  paddleocr:
    port: 8829
    health: /health
    command: >-
      HOME="$HOME/.cache/mdscribe/paddleocr-models"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      "$HOME/.cache/mdscribe/paddleocr-venv/bin/uvicorn"
      server:app --app-dir services/paddleocr --host 127.0.0.1 --port "$PORT" --workers 1
  app:
    health: /api/healthcheck
    command: >-
      export NEXT_PUBLIC_BASE_URL="$PUBLIC_URL"
      BETTER_AUTH_URL="$PUBLIC_URL"
      ADMIN_EMAIL="test@test.com"
      MDSCRIBE_ORB_PREVIEW="1" &&
      bun run --cwd packages/markdoc-md build &&
      bun --bun next dev apps/app --webpack -p "$PORT"
    portal:
      title: MDScribe
      description: Sign in with test@test.com / password123. Changes reload automatically.
